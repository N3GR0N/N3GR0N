<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Órbita animada">
  <defs>
    <radialGradient id="planet" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#f2f2f2"/>
      <stop offset="1" stop-color="#4a4a4a"/>
    </radialGradient>
    <style>
      .s { fill: #fff; animation: tw 3s ease-in-out infinite; }
      .d1 { animation-delay: .6s; } .d2 { animation-delay: 1.4s; } .d3 { animation-delay: 2.2s; }
      @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="300" height="300" fill="#000"/>

  <circle class="s" cx="40"  cy="50"  r="1.3"/>
  <circle class="s d1" cx="250" cy="40"  r="1.6"/>
  <circle class="s d2" cx="270" cy="170" r="1.2"/>
  <circle class="s d3" cx="30"  cy="230" r="1.5"/>
  <circle class="s" cx="120" cy="270" r="1.1"/>
  <circle class="s d2" cx="210" cy="260" r="1.4"/>
  <circle class="s d1" cx="90"  cy="20"  r="1.1"/>
  <circle class="s d3" cx="165" cy="30"  r="1.2"/>

  <g transform="rotate(-22 150 150)">
    <ellipse cx="150" cy="150" rx="105" ry="42" fill="none" stroke="#5a5a5a" stroke-width="1" stroke-dasharray="3 5"/>
    <ellipse cx="150" cy="150" rx="70" ry="28" fill="none" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="2 5"/>
    <circle r="5" fill="#fff">
      <animateMotion dur="9s" repeatCount="indefinite" path="M45,150 a105,42 0 1,0 210,0 a105,42 0 1,0 -210,0"/>
    </circle>
    <circle r="3" fill="#bdbdbd">
      <animateMotion dur="5s" repeatCount="indefinite" path="M80,150 a70,28 0 1,1 140,0 a70,28 0 1,1 -140,0"/>
    </circle>
  </g>

  <circle cx="150" cy="150" r="26" fill="url(#planet)"/>
</svg>
